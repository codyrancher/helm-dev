apiVersion: v2
name: rancher-ha
description: A Rancher server in threes - three replicas, one per node - in a virtual cluster of its own, so several can share one real cluster.
type: application
version: 0.5.0
appVersion: v2.15.1
keywords:
  - rancher
  - ha
home: https://github.com/codyrancher/helm-dev
sources:
  - https://github.com/codyrancher/helm-dev
icon: https://raw.githubusercontent.com/codyrancher/helm-dev/main/charts/rancher-ha/icon.svg
annotations:
  catalog.cattle.io/display-name: Rancher HA
  catalog.cattle.io/release-name: rancher-ha
  catalog.cattle.io/namespace: rancher-ha
  catalog.cattle.io/kube-version: ">=1.26.0-0"
dependencies:
  # The virtual cluster each Rancher gets. Vendored into the packaged chart, so installing it
  # needs nothing from charts.loft.sh at install time.
  - name: vcluster
    version: 0.36.1
    repository: https://charts.loft.sh
    condition: virtualCluster
