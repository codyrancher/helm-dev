<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Three Rancher cow heads">
  <title>rancher-ha</title>
  <defs>
    <!-- One head, drawn once at 0 0 100 96 and placed three times below. Horns are strokes,
         everything else is a filled shape, so the whole mark is one colour and survives being
         scaled down to a list icon. -->
    <g id="cow">
      <path d="M31 30 C 13 24 6 12 11 2" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <path d="M69 30 C 87 24 94 12 89 2" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="14" cy="49" rx="15" ry="9" transform="rotate(-20 14 49)" fill="currentColor"/>
      <ellipse cx="86" cy="49" rx="15" ry="9" transform="rotate(20 86 49)" fill="currentColor"/>
      <path d="M28 32 C 28 25 39 20 50 20 C 61 20 72 25 72 32 L 72 56 C 72 74 65 90 50 90 C 35 90 28 74 28 56 Z" fill="currentColor"/>
      <!-- muzzle, punched back out to the tile colour: it is what stops the head reading as a
           beetle at large sizes, and it closes up harmlessly at small ones -->
      <ellipse cx="50" cy="74" rx="13" ry="10" fill="#F4F6FD"/>
      <circle cx="45" cy="73" r="2.6" fill="currentColor"/>
      <circle cx="55" cy="73" r="2.6" fill="currentColor"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="52" fill="#F4F6FD"/>
  <g color="#2453FF">
    <use href="#cow" transform="translate(73 16) scale(1.1)"/>
    <use href="#cow" transform="translate(8 132) scale(1.1)"/>
    <use href="#cow" transform="translate(138 132) scale(1.1)"/>
  </g>
</svg>
