# What Rancher's install form asks. The first two have their values already filled in; the
# third has to be answered, because several Ranchers on one cluster are told apart by hostname
# and nothing else.
questions:
  - variable: adminPassword
    label: Admin password
    description: The password for the admin user on the new Rancher. At least 12 characters. It is read once, while the new server bootstraps, and can be changed in Rancher afterwards.
    type: password
    required: true
    default: rancher-ha-changeme
    group: Rancher
  - variable: image
    label: Rancher image
    description: The Rancher server image to run. Any tag of rancher/rancher, or your own registry mirror of it.
    type: string
    required: true
    default: rancher/rancher:v2.15.1
    group: Rancher
  - variable: ingress.host
    label: Hostname
    description: The address this Rancher answers on. Each install needs its own - the ingress controller tells them apart by hostname alone. With no DNS to hand, a wildcard service works - <anything>.<node ip with dashes>.sslip.io resolves to that node.
    type: hostname
    required: true
    group: Rancher
  - variable: virtualCluster
    label: Give it a virtual cluster of its own
    description: On by default, and what lets several Ranchers share one real cluster - each gets its own API server, so each gets its own copy of the cluster-scoped things Rancher insists on owning. Turn it off to install Rancher straight into this cluster, which then has to be cattle-system and can hold only one.
    type: boolean
    default: true
    group: Advanced
