{{- if .Values.virtualCluster }}
# The admin password, on this side of the virtual cluster.
#
# Rancher reads it from a Secret next to itself, which in virtual-cluster mode is inside the
# virtual cluster - somewhere you need a separate kubeconfig to reach. That is a silly place to
# have to go for the password to the thing you just installed, so it is published here too, in
# the release's own namespace, where kubectl and the Rancher UI can both see it.
#
# A Secret rather than a line in the access ConfigMap beside it: this is the same value whether
# it is a placeholder or somebody's real password, and the difference between the two is only
# ever a --set away.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rancher-ha.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    rancher-ha.helm-dev/url: {{ printf "https://%s" (include "rancher-ha.host" .) | quote }}
type: Opaque
stringData:
  username: admin
  password: {{ required "adminPassword must not be empty" .Values.adminPassword | quote }}
{{- end }}
