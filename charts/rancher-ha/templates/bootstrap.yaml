{{- if or .Values.virtualCluster .Values.skipFirstRun }}
{{- $ns := .Release.Namespace -}}
{{- $host := include "rancher-ha.host" . -}}
{{- $name := include "rancher-ha.fullname" . -}}
# Getting Rancher inside the virtual cluster.
#
# Helm installs into one cluster, and the virtual cluster does not exist until this release
# creates it - so the manifests cannot simply be part of the release. They are carried in a
# ConfigMap and applied by a hook that waits for the virtual cluster to answer.
#
# The obvious alternative, vCluster's own experimental.deploy.vcluster.helm, cannot be used
# here: it is a subchart value, and Helm does not template subchart values, so the password,
# image and hostname somebody just typed could never reach it.
{{- if .Values.virtualCluster }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-manifests
  namespace: {{ $ns }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  rancher.yaml: |
{{ include "rancher-ha.manifests" . | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
---
# One secret, in one namespace: the virtual cluster's kubeconfig. Nothing else is needed,
# because everything this Job goes on to create it creates on the other side of that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "rancher-ha.vclusterSecret" . }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-bootstrap
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: {{ $name }}-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: {{ $name }}-bootstrap
    spec:
      serviceAccountName: {{ if .Values.virtualCluster }}{{ $name }}-bootstrap{{ else }}{{ $name }}{{ end }}
      restartPolicy: Never
{{- if .Values.virtualCluster }}
      volumes:
        - name: manifests
          configMap:
            name: {{ $name }}-manifests
{{- end }}
      containers:
        - name: bootstrap
          # The Rancher image again: it carries kubectl, and it is the image being pulled onto
          # these nodes anyway, so the bootstrap costs no second pull.
          image: {{ .Values.image | quote }}
{{- if .Values.virtualCluster }}
          volumeMounts:
            - name: manifests
              mountPath: /manifests
{{- end }}
          command: [/bin/sh, -c]
          args:
            - |
              set -e
{{- if .Values.virtualCluster }}
              echo "waiting for the virtual cluster's kubeconfig"
              i=0
              until kubectl -n {{ $ns }} get secret {{ include "rancher-ha.vclusterSecret" . }} >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 120 ]; then
                  echo "the virtual cluster never published a kubeconfig:"
                  kubectl -n {{ $ns }} get secret {{ include "rancher-ha.vclusterSecret" . }} || true
                  exit 1
                fi
                sleep 5
              done

              # The kubeconfig it publishes is written for a port-forward, so the server in it
              # is localhost. From in here the virtual cluster is an ordinary Service - but it
              # has to be addressed as <service>.<namespace> and not <service>.<namespace>.svc,
              # because that is what is in the certificate vCluster generates. The longer form
              # resolves perfectly well and then fails to verify.
              kubectl -n {{ $ns }} get secret {{ include "rancher-ha.vclusterSecret" . }} \
                -o jsonpath='{.data.config}' | base64 -d \
                | sed 's|https://localhost:8443|https://{{ include "rancher-ha.vclusterService" . }}.{{ $ns }}:443|' > /tmp/vc.kubeconfig
              export KUBECONFIG=/tmp/vc.kubeconfig

              echo "waiting for the virtual cluster to answer"
              i=0
              until kubectl get namespace >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 120 ]; then
                  # Say what actually went wrong. A wait loop that swallows its error leaves
                  # nothing behind but the fact that it waited.
                  echo "the virtual cluster never became reachable:"
                  kubectl get namespace || true
                  exit 1
                fi
                sleep 5
              done

              kubectl create namespace {{ include "rancher-ha.targetNamespace" . }} --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -f /manifests/rancher.yaml
              echo "Rancher applied inside the virtual cluster; it takes a few minutes to answer"
{{- end }}
{{- if .Values.skipFirstRun }}

              # Answer Rancher's first-run screens, which it would otherwise ask a person.
              #
              # A new Rancher greets its first visitor with the bootstrap-password page and then
              # a wizard asking for the server URL and for the EULA to be accepted. All three
              # are settings, and this chart already knows every answer - the URL is its own
              # ingress host - so there is nothing to ask. Rancher creates the settings itself
              # at startup with empty values, so this waits for them rather than creating them.
              echo "waiting for Rancher to create its settings"
              i=0
              until kubectl get settings.management.cattle.io server-url >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 180 ]; then
                  echo "Rancher never created its settings:"
                  kubectl get settings.management.cattle.io server-url || true
                  exit 1
                fi
                sleep 5
              done

              kubectl patch settings.management.cattle.io server-url --type=merge \
                -p '{"value":"https://{{ $host }}"}'
              kubectl patch settings.management.cattle.io first-login --type=merge \
                -p '{"value":"false"}'
              kubectl patch settings.management.cattle.io eula-agreed --type=merge \
                -p "{\"value\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
              echo "first-run screens answered; the site opens on a plain login page"
{{- end }}
{{- end }}
