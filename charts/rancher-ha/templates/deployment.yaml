# Rancher itself: three replicas, one per node.
#
# The anti-affinity is `required`, not `preferred`, and that is the whole of what makes this HA
# rather than three pods that might share a machine. It is also the second half of the node
# requirement - the first is the check in _helpers.tpl, which says it in words.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-ha.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "rancher-ha.fullname" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ include "rancher-ha.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "rancher-ha.fullname" . }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ include "rancher-ha.fullname" . }}
              topologyKey: kubernetes.io/hostname
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rancher
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
            - containerPort: 444
              protocol: TCP
            - containerPort: 6666
              protocol: TCP
          args:
            # TLS is terminated by the ingress controller in front of this, so Rancher neither
            # serves a CA of its own nor needs its trust store cleared for one.
            - --no-cacerts
            - --http-listen-port=80
            - --https-listen-port=443
            - --add-local={{ .Values.addLocal }}
          env:
            - name: CATTLE_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: CATTLE_PEER_SERVICE
              value: {{ include "rancher-ha.fullname" . }}
            - name: CATTLE_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rancher-ha.fullname" . }}-bootstrap
                  key: bootstrapPassword
            - name: IMPERATIVE_API_DIRECT
              value: "true"
            - name: IMPERATIVE_API_APP_SELECTOR
              value: {{ include "rancher-ha.fullname" . }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
