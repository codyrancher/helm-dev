{{- if .Values.ingress.enabled }}
# How the browser gets in, and why there is usually no hostname in it.
#
# With ingress.host empty the rule carries no host, so it matches every request that reaches
# the controller - the public IP of any node is a working address, with no DNS to arrange
# first. The controller answers 443 with its own self-signed certificate, so the browser warns
# once and the session is still TLS, which matters: Rancher sets secure cookies and a login
# over plain HTTP does not stick.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rancher-ha.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
  annotations:
    # Rancher's own numbers. The long read timeout is what keeps its websockets - the shell,
    # log tailing, every live-updating page - from being cut at the proxy after a minute.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
{{- with .Values.ingress.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rancher-ha.fullname" . }}
                port:
                  number: 80
{{- end }}
