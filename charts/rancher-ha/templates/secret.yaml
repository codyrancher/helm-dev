# The password the first login uses.
#
# Rancher reads it while it is bootstrapping a cluster that has no admin yet and stores a hash,
# so changing this afterwards changes nothing - the admin password is changed in Rancher.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rancher-ha.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
type: Opaque
stringData:
  bootstrapPassword: {{ required "adminPassword must not be empty" .Values.adminPassword | quote }}
