# Two services, and the second one is not decoration.
#
# The first is what the ingress sends traffic to. The second is how the replicas find each
# other: CATTLE_PEER_SERVICE names a service and Rancher reads its endpoints to learn the pods
# it shares leadership with. Without it, three replicas are three separate Ranchers.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rancher-ha.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
  selector:
    app: {{ include "rancher-ha.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rancher-ha.fullname" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rancher-ha.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 444
      protocol: TCP
      name: https-internal
  selector:
    app: {{ include "rancher-ha.fullname" . }}
