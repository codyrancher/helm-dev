# The two the install form asks for. Both have defaults, so an install with no answers at all
# still produces a working Rancher - and the password default is a placeholder that says so.
adminPassword: rancher-ha-changeme
image: rancher/rancher:v2.15.1

# Three replicas on three nodes is what this chart is for. Lowering it does not make the chart
# install on a smaller cluster: the node check and the anti-affinity below are both keyed to
# needing one node per replica, which is the point.
replicas: 3

# Whether this Rancher adopts the cluster it runs on as its `local` cluster.
#
# Kept at true because it is not really optional: the flag has been deprecated since Rancher
# 2.5 and the server refuses to start with it off. It is here to be read rather than changed -
# it is the reason this chart wants a cluster of its own. Installed onto a cluster that another
# Rancher already manages, the two reconcile one cattle-system, and fleet-agent in particular
# has exactly one owner: the second Rancher takes it over and the first loses the cluster.
addLocal: true

# The check that refuses a cluster too small to spread three replicas over. Both halves can be
# turned off together for a deliberate single-node trial; nothing else in the chart changes.
nodeCheck:
  enabled: true
  minNodes: 3

ingress:
  enabled: true
  className: nginx
  # Left empty on purpose: an ingress rule with no host matches every request that reaches the
  # controller, so the public IP of any node is a working address with no DNS to arrange. Set
  # it to a real name and the rule is bound to that name instead.
  host: ""
  annotations: {}

service:
  type: ClusterIP

resources: {}

nodeSelector: {}
tolerations: []
